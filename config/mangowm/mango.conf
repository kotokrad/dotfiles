# Sourced by the Nix-generated ~/.config/mango/config.conf (see default.nix), which keeps
# only what needs Nix: cursor from stylix and session startup. Edits here reload live.

env = GDK_SCALE,2
env = NIXOS_OZONE_WL,1
env = NIXPKGS_ALLOW_UNFREE,1
env = XDG_CURRENT_DESKTOP,mango
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,mango
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = SDL_VIDEODRIVER,x11
env = MOZ_ENABLE_WAYLAND,1

monitor_rule = name:^eDP-1$,scale:2,x:560,y:1440
monitor_rule = make:Dell Inc.,model:DELL U3223QE,scale:1.5,x:0,y:0

# Input
xkb_rules_layout = us,ru,ua
xkb_rules_options = grp:lalt_lshift_toggle,caps:escape
numlock_on = 1
repeat_delay = 200
repeat_rate = 35
trackpad_scroll_factor = 0.3
device_rule = name:Kensington Expert Mouse,scroll_method:4,scroll_button:274
device_rule = name:Bluetooth Ergonomic Mouse,accel_speed:-0.6

# Look
border_px = 0
border_radius = 4
gap_inner_horizontal = 2
gap_inner_vertical = 2
gap_outer_horizontal = 4
gap_outer_vertical = 4
blur = 1
blur_params_radius = 5
blur_params_num_passes = 3
animation_duration_open = 300
animation_duration_close = 200
animation_duration_move = 200
animation_duration_tag = 500

# Layouts
new_is_master = 1
default_master_factor = 0.5
tag_rule = id:1,layout_name:monocle
tag_rule = id:5,layout_name:monocle
circle_layout = tile,monocle
monocle_tab_mode = 0

# Misc
focus_cross_monitor = 1
exchange_cross_monitor = 1
idle_inhibit_when_fullscreen = 1
xwayland_ignore_scale = 1
cursor_hide_on_keypress = 1
cursor_hide_timeout = 1
allow_lock_transparent = 1

bind = SUPER,Return,spawn,foot
bind = SUPER,w,spawn,rofi-launcher
bind = SUPER,r,spawn,rofi -show run -no-show-icons
bind = SUPER+SHIFT,w,spawn,web-search
bind = SUPER,s,spawn_shell,grim -l 9 -t png -g "$(slurp)" - | wl-copy -t image/png
bind = SUPER+SHIFT,s,spawn_shell,grim -l 9 -t png -g "$(slurp)" ~/screenshot-$(date +%F_%H-%M-%S).png
bind = SUPER,c,spawn,hyprpicker -a
bind = SUPER,e,spawn,thunar
bind = SUPER,n,toggle_named_scratchpad,notes,none,foot --app-id=notes --working-directory=/home/kotokrad/notes nvim scratchpad.md
bind = SUPER,m,spawn,pavucontrol
bind = SUPER,p,spawn,qs ipc call vpn toggle
bind = SUPER,q,killclient
bind = SUPER,f,togglemaximizescreen
bind = SUPER+SHIFT,f,togglefullscreen
bind = SUPER,t,togglefloating
bind = SUPER,o,tagmon,next
bind = SUPER,grave,focusmon,next
bind = SUPER+SHIFT,q,quit
bind = SUPER+SHIFT,Return,zoom
bind = SUPER+CTRL,space,switch_layout
bind = SUPER,h,focusdir,left
bind = SUPER,l,focusdir,right
bind = SUPER,k,focusdir,up
bind = SUPER,j,focusdir,down
bind = SUPER,Left,focusdir,left
bind = SUPER,Right,focusdir,right
bind = SUPER,Up,focusdir,up
bind = SUPER,Down,focusdir,down
bind = SUPER+SHIFT,h,move_client,left
bind = SUPER+SHIFT,l,move_client,right
bind = SUPER+SHIFT,k,move_client,up
bind = SUPER+SHIFT,j,move_client,down
bind = SUPER+SHIFT,Left,move_client,left
bind = SUPER+SHIFT,Right,move_client,right
bind = SUPER+SHIFT,Up,move_client,up
bind = SUPER+SHIFT,Down,move_client,down
# mango-focus-stack is defined in default.nix
bind = SUPER,Tab,spawn,mango-focus-stack next
bind = SUPER+SHIFT,Tab,spawn,mango-focus-stack prev
bind = SUPER,space,toggle_special_tag
bind = SUPER+SHIFT,space,tag_special_tag
bind = SUPER,1,view,1
bind = SUPER,2,view,2
bind = SUPER,3,view,3
bind = SUPER,4,view,4
bind = SUPER,5,view,5
bind = SUPER,6,view,6
bind = SUPER,7,view,7
bind = SUPER,8,view,8
bind = SUPER,9,view,9
bind = SUPER+SHIFT,1,tag,1
bind = SUPER+SHIFT,2,tag,2
bind = SUPER+SHIFT,3,tag,3
bind = SUPER+SHIFT,4,tag,4
bind = SUPER+SHIFT,5,tag,5
bind = SUPER+SHIFT,6,tag,6
bind = SUPER+SHIFT,7,tag,7
bind = SUPER+SHIFT,8,tag,8
bind = SUPER+SHIFT,9,tag,9
bind = SUPER+CTRL,Right,viewtoright_have_client
bind = SUPER+CTRL,Left,viewtoleft_have_client
bind = NONE,XF86AudioRaiseVolume,spawn,qs ipc call volume up
bind = NONE,XF86AudioLowerVolume,spawn,qs ipc call volume down
bind = NONE,XF86AudioMute,spawn,qs ipc call volume mute
bind = NONE,XF86AudioPlay,spawn,playerctl play-pause
bind = NONE,XF86AudioNext,spawn,playerctl next
bind = NONE,XF86AudioPrev,spawn,playerctl previous
bind = NONE,XF86MonBrightnessDown,spawn,qs ipc call brightness down
bind = NONE,XF86MonBrightnessUp,spawn,qs ipc call brightness up

mousebind = SUPER,btn_left,moveresize,curmove
mousebind = SUPER,btn_right,moveresize,curresize

axisbind = SUPER,UP,viewtoleft_have_client
axisbind = SUPER,DOWN,viewtoright_have_client

switchbind = fold,spawn,loginctl lock-session

# Rules only match at map time; dialogs with a parent window float on their own

# Workspaces
window_rule = tags:1,app_id:^(Brave-browser(-beta|-dev|-unstable)?|[Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Gg]oogle-chrome(-beta|-dev|-unstable)?|[Tt]horium-browser|[Cc]achy-browser)$
window_rule = tags:2,focused_opacity:0.99,unfocused_opacity:0.95,app_id:^(foot|Alacritty|kitty|wezterm|com.mitchellh.ghostty)$
window_rule = tags:3,focused_opacity:0.99,unfocused_opacity:0.95,app_id:^(codium|codium-url-handler|VSCodium|VSCode|code-url-handler)$
window_rule = tags:4,focused_opacity:0.9,unfocused_opacity:0.8,app_id:^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
window_rule = tags:5,focused_opacity:0.94,unfocused_opacity:0.86,app_id:^([Dd]iscord|[Ww]ebCord|[Vv]esktop|[Ww]hatsapp-for-linux|org.telegram.desktop|io.github.tdesktop_x64.TDesktop|teams-for-linux)$

# Settings and dialogs: float centered over the current tag
# (rule values are capped at 255 bytes, hence two lines)
window_rule = is_floating:1,width:0.7,height:0.7,focused_opacity:0.9,unfocused_opacity:0.8,app_id:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol|nm-applet|nm-connection-editor|blueman-manager|dev.deedles.Trayscale|wihotspot(-gui)?)$
window_rule = is_floating:1,width:0.7,height:0.7,focused_opacity:0.9,unfocused_opacity:0.8,app_id:^(gnome-disks|file-roller|org.gnome.FileRoller|xfce4-taskmanager|nwg-look|qt5ct|qt6ct|[Yy]ad)$
window_rule = is_floating:1,width:0.7,height:0.6,app_id:^xdg-desktop-portal-gtk$
window_rule = is_floating:1,width:0.7,height:0.6,title:^(Open Files|Save File|Add Folder to Workspace)$
window_rule = is_floating:1,width:0.6,height:0.5,title:wants to save
window_rule = is_floating:1,title:^(Authentication Required|File Operation Progress|Rename .*)$
window_rule = is_floating:1,app_id:^opensnitch_ui$,title:^(?!OpenSnitch Network Statistics)
window_rule = width:0.3,height:0.4,app_id:^opensnitch_ui$,title:^OpenSnitch v
window_rule = is_floating:1,width:0.6,height:0.7,app_id:^[Ff]erdium$
# Chromium extension popups, see extension-popups in default.nix
window_rule = is_floating:1,width:500,height:800,title:^_crx_
window_rule = is_floating:1,app_id:^(mpv|com.github.rafostar.Clapper)$
window_rule = is_floating:1,app_id:^[Ss]team$,title:^(?![Ss]team$)
window_rule = is_floating:1,app_id:^steam_app_default$

# Media
window_rule = is_floating:1,is_global:1,offset_x:80,offset_y:-80,focused_opacity:0.95,unfocused_opacity:0.75,title:^Picture-in-Picture$
# Telegram media viewer fix
window_rule = is_floating:1,no_animation:1,width:0.99,height:0.96,title:^Media viewer$

# Games (title:.+ skips wine's untitled helper window)
window_rule = is_fullscreen:1,no_blur:1,app_id:^gamescope$
window_rule = is_fullscreen:1,no_blur:1,app_id:^steam_app_[0-9]+$,title:.+

# Opacity
window_rule = focused_opacity:0.9,unfocused_opacity:0.8,app_id:^(gedit|org.gnome.TextEditor|mousepad|seahorse)$

# Scratchpads
window_rule = is_named_scratchpad:1,width:0.5,height:0.6,app_id:^notes$

# Keep slurp's selection overlay out of screenshots
layer_rule = no_animation:1,no_blur:1,layer_name:selection

# Meta+Esc without key repeat: the press switches tag and enters esc_held, where repeats match
# nothing; releasing Esc goes back. c (allow-conflict) lets both binds run on one press.
bindc = SUPER,Escape,view,-1
bindc = SUPER,Escape,setkeymode,esc_held

# Keep this last: every bind after a key_mode line belongs to that mode
key_mode = esc_held
bindr = SUPER,Escape,setkeymode,default
bindr = NONE,Escape,setkeymode,default
